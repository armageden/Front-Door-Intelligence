name: checks

# Runs every gate that is marked "available" in the docs contract at
# docs/.docsrc.json: typecheck, test, build, build:verify, build:web, build:firetv, and
# docs:check — the same commands `npm run all` chains locally, in the same order.
#
# Commands are not hardcoded here. Each step reads its command from
# commands.<name>.run in the contract, so the workflow and the documented
# commands cannot drift apart. When a command changes in the contract, this
# workflow follows with no edit.
#
# Steps whose contract status is "unavailable" are deliberately absent rather than
# stubbed — a command that cannot run should not be here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The contract requires Node >= 20. The matrix exists so a change that
        # breaks one supported version cannot hide behind another.
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read gate commands from the contract
        id: gates
        run: |
          node -e '
            const c = require("./docs/.docsrc.json");
            const names = ["typecheck", "test", "build", "buildVerify", "buildWeb", "buildFiretv", "docsCheck"];
            for (const n of names) {
              const cmd = c.commands[n];
              if (!cmd || cmd.status !== "available" || !cmd.run) {
                console.error(`::error::commands.${n} is not "available" in the contract`);
                process.exit(1);
              }
              console.log(`${n}=${cmd.run}`);
            }
          ' >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: ${{ steps.gates.outputs.typecheck }}

      - name: Test
        run: ${{ steps.gates.outputs.test }}

      # build:verify asserts against dist/, so the build must run first. The step order is
      # the whole reason this gate was once missing from CI — see the contract's ci note.
      - name: Build Lambda bundles
        run: ${{ steps.gates.outputs.build }}

      - name: Verify Lambda bundles
        run: ${{ steps.gates.outputs.buildVerify }}

      # Reads web/src/ and writes web/dist/, so unlike build:verify it cannot fail on
      # ordering.
      - name: Build web dashboard
        run: ${{ steps.gates.outputs.buildWeb }}

      # Same shape as build:web — reads firetv/src/, writes firetv/dist/, order-independent.
      - name: Build Fire TV overlay client
        run: ${{ steps.gates.outputs.buildFiretv }}

      - name: Validate documentation structure
        run: ${{ steps.gates.outputs.docsCheck }}
