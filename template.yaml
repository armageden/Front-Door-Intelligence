# AWS SAM template — Front Door Intelligence
#
# NOT DEPLOYED AND NOT VALIDATED. No AWS account, no SAM CLI, and no
# `sam validate` run is available in this environment, so this file has been checked
# only for YAML well-formedness and for internal consistency with the code. Treat it
# as a scaffold, not as a working deployment.
#
# It declares every stage that exists today: webhook ingress, the describe stage, overlay
# delivery, the event query, and the daily summary, plus the three DynamoDB tables, two
# SQS queues, the HTTP API, the WebSocket API, and the snapshot bucket they use. See
# docs/03-repository/01-current-state.md for the inventory and
# docs/03-repository/04-planned-structure.md for what is still unwritten.
#
# The handler is deployed from compiled JavaScript, not TypeScript. `npm run build`
# emits CommonJS to dist/, and SAM packages the `dist` directory. The Handler
# property below is therefore `dist/handlers/webhookHandler.handler`, matching
# tsconfig.build.json's `rootDir: src`.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Front Door Intelligence — Ring webhook to AI description to Fire TV overlay. Every
  stage described in ARCHITECTURE.md §3 is written and tested against fakes. Never
  deployed: no AWS account and no SAM CLI are available in this environment.

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: >-
      HMAC Signature Key from the Ring app credentials (ARCHITECTURE.md §3.1). Shown
      once when the Ring app is created and cannot be regenerated.
  RingClientId:
    Type: String
    NoEcho: true
    Description: Ring Partner API Client ID (ARCHITECTURE.md §3.1).
  RingClientSecret:
    Type: String
    NoEcho: true
    Description: Ring Partner API Client Secret (ARCHITECTURE.md §3.1).
  RingRefreshToken:
    Type: String
    NoEcho: true
    Description: >-
      Ring OAuth refresh token, ~30 day lifetime (ARCHITECTURE.md §3.2). Must be
      refreshed before expiry or the describe stage loses API access.
  QueryApiKey:
    Type: String
    NoEcho: true
    Description: >-
      Shared key guarding GET /events/today, sent as the X-Query-Key header. ARCHITECTURE.md
      §5.2 specifies the endpoint but names no auth mechanism; §6's mitigation table omits
      it. Recorded as decision D022. Replace with a real authorizer before any multi-user
      deployment — a static key does not distinguish one homeowner from another.
  DailySummaryTimezone:
    Type: String
    Default: UTC
    Description: >-
      IANA timezone the 9 PM daily summary (ARCHITECTURE.md §3.6) is scheduled in. The
      events table is partitioned by a UTC date, so a zone behind UTC fires after that
      UTC date has already begun and the summary covers a day that is not over. See
      decision D025.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: >-
      ARCHITECTURE.md §3.3 offers anthropic.claude-3-haiku or amazon.nova-lite-v1 for
      cost. This is not a real ID for every account: use the one your Bedrock access
      actually lists.
  SnapshotBucketName:
    Type: String
    Default: front-door-snapshots
  ConnectionsTableName:
    Type: String
    Default: FrontDoorConnections
  EventsTableName:
    Type: String
    Default: FrontDoorEvents
  IdempotencyTableName:
    Type: String
    Default: FrontDoorIdempotency
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  DashboardAllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: >-
      Origins allowed to call the HTTP API from a browser, comma separated. Set this to the
      GitHub Pages URL once you know it, for example
      https://armageden.github.io. The default of `*` works for a demo but means any page on
      the internet may read GET /events/today if it somehow has the key — narrow it before
      anything real is deployed. The WebSocket API needs no CORS; the overlay client is not
      subject to the preflight rule.
  BedrockMonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: >-
      Monthly Amazon Bedrock spend, in USD, at which this stack notifies you.
      ARCHITECTURE.md §6 requires a CloudWatch billing alarm as the detection half of the
      Bedrock cost-runaway mitigation. See the CostAlarmBedrockBudget resource below for
      why this is declared as an AWS Budget rather than a CloudWatch alarm, and decision
      D027. NFR7 asks for free-tier discipline; the default is well inside it.
  CostAlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Address notified when the Bedrock budget threshold is crossed. Leave empty to create
      the budget with no subscriber — AWS sends nothing, but the budget still tracks and
      appears in the console. AWS requires the address to be confirmed before it will
      deliver, so the first notification arrives only after that confirmation.

Globals:
  Function:
    Runtime: nodejs22.x
    # NFR1: the webhook must answer within 5 seconds. Giving the function more than
    # that would only let it die later; Ring treats a timeout as a 5xx and retries.
    Timeout: 5
    MemorySize: 256
    # Pinned to the major version actually tested. Node 24 is also verified locally.
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        # Consumed by the AWS SDK itself, not by application code.
        AWS_REGION: !Ref AWS::Region
        NODE_OPTIONS: '--enable-source-maps'

Resources:
  # --- DynamoDB (ARCHITECTURE.md §3.5) -----------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref EventsTableName
      # Partitions by date so GET /events/today is a single Query, never a scan.
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        # timestamp#event_id, so a day's events come back already time-ordered and
        # two events in the same millisecond cannot collide.
        - AttributeName: sort_key
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      # ARCHITECTURE.md §3.5 specifies 90 days. The attribute is declared here AND written by
      # putEvent/putSummary in src/lib/dynamoClient.ts, both derived from the row's own date
      # partition rather than from write time. DynamoDB deletes expired items within 48 hours.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref IdempotencyTableName
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # 24 hours: long enough to absorb Ring's retry schedule (1s → 5s → 30s → 2min →
      # 10min → 1hr), short enough not to grow without bound.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # --- Ingress (ARCHITECTURE.md §3.1) ------------------------------------------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-webhook'
      CodeUri: dist/
      Handler: handlers/webhookHandler.handler
      Description: >-
        POST /webhook/ring. Verifies the X-Signature HMAC over the raw body, claims
        request_id for idempotency, stores the event, hands it to the describe queue,
        and returns immediately.
      Environment:
        Variables:
          RING_WEBHOOK_SECRET: !Ref WebhookSecret
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          DYNAMODB_IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
          EVENT_QUEUE_URL: !Ref DescribeQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - S3CrudPolicy:
            BucketName: !Ref SnapshotBucket
        # Hand-off only. Keeping the describe stage's own permissions off this function
        # is the least-privilege line ARCHITECTURE.md §6 asks for, and it is what makes
        # an ingress compromise cheap.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DescribeQueue.QueueName
      Events:
        # Ring's documented behaviour: 2xx succeeds, 4xx is a permanent failure with no
        # retry, 5xx and timeout retry. The function returns 500 on unexpected errors
        # precisely so a transient failure is retried.
        HttpApi:
          Type: Api
          Properties:
            Path: /webhook/ring
            Method: POST

  # --- Describe stage (ARCHITECTURE.md §3.2, §3.3) ------------------------------
  #
  # Separate from ingress on purpose: the Ring docs name inline heavy processing in
  # the webhook handler as a Common Mistake, because it exceeds the 5-second budget
  # NFR1 requires. This stage consumes the queue and does the media fetch and the
  # Bedrock call.

  DescribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-describe'
      CodeUri: dist/
      Handler: handlers/snapshotFetcher.handler
      Description: >-
        Fetches a camera snapshot via the Ring Partner API and produces a one-sentence
        Bedrock description. Falls back to a deterministic local summary when Bedrock
        is unavailable (FR11).
      # Longer than the webhook's 5s: this stage is deliberately off the latency path.
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          RING_CLIENT_ID: !Ref RingClientId
          RING_CLIENT_SECRET: !Ref RingClientSecret
          RING_REFRESH_TOKEN: !Ref RingRefreshToken
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - S3CrudPolicy:
            BucketName: !Ref SnapshotBucket
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        DescribeQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt DescribeQueue.QueueArn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  DescribeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-describe'
      # The event is a signal, not a record. The events table is the record, so a lost
      # message costs a description, not an event.
      MessageRetentionPeriod: 345600
      # Must exceed the function's 60s timeout, or a slow invocation is redelivered
      # while the first is still running.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DescribeQueueDlq.Arn
        maxReceiveCount: 5

  DescribeQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-describe-dlq'
      MessageRetentionPeriod: 1209600

  # --- Overlay delivery (ARCHITECTURE.md §3.4) -----------------------------------

  # Connection registry. API Gateway owns the socket and delivers the connection id to
  # $connect exactly once, so this table is the only way to push later. Not in the
  # ARCHITECTURE.md §11 planned tree - recorded as decision D020.
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ConnectionsTableName
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # A client that vanishes without a clean $disconnect must not persist forever.
      # The real signal is GoneException on the next push; this just bounds growth.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  OverlayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-overlay'
      CodeUri: dist/
      Handler: handlers/overlayPusher.handler
      Description: >-
        Pushes the finished description to connected Fire TV clients over a WebSocket.
        Prunes connections API Gateway has forgotten.
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
          WEBSOCKET_ENDPOINT: !Sub 'https://${OverlayWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        # Read-only on the snapshot bucket: the stage signs URLs, it does not upload.
        - S3ReadPolicy:
            BucketName: !Ref SnapshotBucket
        - Statement:
            - Effect: Allow
              Action: [execute-api:ManageConnections]
              Resource:
                - !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OverlayWebSocketApi}/*'
      Events:
        OverlayQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OverlayQueue.QueueArn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  OverlayQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-overlay'
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OverlayQueueDlq.Arn
        maxReceiveCount: 5

  OverlayQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-overlay-dlq'
      MessageRetentionPeriod: 1209600

  # The WebSocket API D001 chose over SNS. $connect and $disconnect are load-bearing:
  # the connection id is delivered to them and nowhere else, so without these routes
  # nothing can ever be pushed and every description is silently dropped.
  OverlayWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-overlay-ws'
      ProtocolType: WEBSOCKET
      # Every payload the pusher posts is a bare $3.4 message with no `action` field, so
      # this expression routes NOTHING the pipeline sends. $connect is fine — it carries a
      # query string, not a body, and is matched by route key rather than by expression —
      # which is why the delivery path works today. It was, however, one client-side message
      # away from a 403 on the socket.
      RouteSelectionExpression: '$request.body.action'

  # $default catches anything that does not match, which is every frame the overlay client
  # sends. It routes to the same handler as $disconnect: a message is not a lifecycle event,
  # so the client ignores it and the connection is left alone. Declaring it is what turns a
  # silent 403 into a no-op.
  OverlayDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OverlayWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${OverlayDisconnectFunction}'

  OverlayConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: handlers/overlayPusher.onConnect
      Description: >-
        Registers a WebSocket connection id. Separate from the pusher so a socket is
        not held open by a pusher invocation.
      Timeout: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
      Events:
        Connect:
          Type: ApiGatewayWebSocket
          Properties:
            Route: $connect
            RestApiId: !Ref OverlayWebSocketApi

  OverlayDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: handlers/overlayPusher.onDisconnect
      Description: Removes a WebSocket connection id.
      Timeout: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
      Events:
        Disconnect:
          Type: ApiGatewayWebSocket
          Properties:
            Route: $disconnect
            RestApiId: !Ref OverlayWebSocketApi

  OverlayWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref OverlayWebSocketApi
      StageName: prod
      AutoDeploy: true

  # --- Snapshot storage (ARCHITECTURE.md §3.5, §6) -------------------------------

  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SnapshotBucketName
      # Not public, per §6. Access is via pre-signed URLs with a 1-hour expiry.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # GET on a pre-signed URL is a cross-origin fetch from the dashboard, and S3 answers
      # without Access-Control-Allow-Origin by default. An <img> tag still paints without
      # it, which is why this is not the same severity as the API gap — but any future
      # canvas read, or a fetch() of the bytes rather than the element, fails on it. Cheap to
      # declare while the bucket is being edited, and it needs no credentials because
      # signed GET requests are unauthenticated by design.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref DashboardAllowedOrigins
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 300

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub '${SnapshotBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # --- Query stage (ARCHITECTURE.md §4.2) ---------------------------------------

  EventQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-events-query'
      CodeUri: dist/
      Handler: handlers/eventQuery.handler
      Description: >-
        GET /events/today. Queries the events table by its UTC date partition and returns
        the §5.2 response with a pre-signed snapshot URL per event.
      Environment:
        Variables:
          QUERY_API_KEY: !Ref QueryApiKey
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
      Policies:
        # Read-only. This stage is a query; it must not be able to write or delete an
        # event, so the events table gets read actions and nothing else.
        # GetItem is here for the day's summary row (§3.6), which is read on its known key
        # rather than queried. No UpdateItem, no DeleteItem, no Scan.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource: !GetAtt EventsTable.Arn
        # s3:GetObject only, for signing. No ListBucket, no PutObject.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${SnapshotBucket.Arn}/*'
      Events:
        HttpApi:
          Type: Api
          Properties:
            Path: /events/today
            Method: GET

  # --- Daily summary (ARCHITECTURE.md §3.6) -------------------------------------

  DailySummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-daily-summary'
      CodeUri: dist/
      Handler: handlers/dailySummary.handler
      Description: >-
        Summarises one UTC date partition of the events table into 2-3 sentences and
        writes the result back into that partition as a summary item. Invoked by the
        schedule below, never by another stage.
      # Longer than the globals default: a full day's events in one Query plus one Bedrock
      # call. Nothing on the 5-second webhook path depends on this.
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
      Policies:
        # Query and Put only. No Update, no Delete, no Scan: this function reads one
        # partition and writes exactly one row, and a compromised summary job must not be
        # able to rewrite an event.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt EventsTable.Arn
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        DailySummarySchedule:
          Type: ScheduleV2
          Properties:
            # ARCHITECTURE.md §3.6 says 9 PM. That is local time, and the events table is
            # partitioned by a UTC date (decision D014), so a homeowner in a zone behind
            # UTC would get a summary of a partition that does not yet hold their evening.
            # The timezone is a parameter so the operator states which day they mean;
            # see docs/06-handlers/05-daily-summary.md and decision D025.
            ScheduleExpression: 'cron(0 21 * * ? *)'
            # §3.6's "9 PM local" is literal here: EventBridge Scheduler evaluates the cron
            # in this zone. The consequence is that the partition summarised is a UTC date,
            # so a zone behind UTC fires after that UTC date has begun — see D025.
            ScheduleExpressionTimezone: !Ref DailySummaryTimezone
            Name: !Sub '${AWS::StackName}-daily-summary'
            Description: >-
              ARCHITECTURE.md §3.6 daily summary. Reads the UTC date partition for the
              invocation date and writes one summary row into it. A zone behind UTC shifts
              which partition gets summarised; see decision D025.
            State: ENABLED
      # No SES email. ARCHITECTURE.md §3.6 calls it optional, and it needs a verified
      # identity and a destination this stack does not have. See the handler's module
      # header and docs/06-handlers/05-daily-summary.md.

  # --- API Gateway (ARCHITECTURE.md §3.1) ---------------------------------------

  # CORS is not optional here, and this was a silent omission for the whole life of the
  # template until 2026-10-04. The dashboard is a browser app: it is published to GitHub
  # Pages by .github/workflows/demos.yml, and it fetches an API base URL on a different
  # origin. It also sends `X-Query-Key`, which is not a CORS-safelisted request header, so
  # the browser issues a PREFLIGHT before the real request. With no CORS configuration the
  # preflight gets no Access-Control-Allow-Origin and the fetch fails — while every fixture
  # demo works perfectly, because a same-origin fixture never preflights. That is the worst
  # possible shape for a bug: the demos you test are green and the live one is broken.
  #
  # AllowedOrigins is a CommaDelimitedList parameter rather than a hard-coded `*` for two
  # reasons. A wildcard plus a custom auth header is a smell that invites a review finding;
  # and GET /events/today returns a homeowner's door activity, so the set of pages allowed to
  # read it is a security control that belongs to the deployer. Split on comma because that is
  # what CommaDelimitedList produces, and allow the headers this client actually sends.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AWS::StackName
      CorsConfiguration:
        AllowOrigins: !Ref DashboardAllowedOrigins
        AllowHeaders:
          - Content-Type
          - X-Query-Key
        AllowMethods:
          - GET
          - OPTIONS
        # No AllowCredentials: the API key travels in a header, not a cookie, so there is
        # nothing to send. Adding it would restrict the wildcard case and buy nothing.
        MaxAge: 600

  # --- Observability (ARCHITECTURE.md §7) ---------------------------------------

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WebhookFunction}'
      RetentionInDays: !Ref LogRetentionDays

  DescribeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DescribeFunction}'
      RetentionInDays: !Ref LogRetentionDays

  OverlayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OverlayFunction}'
      RetentionInDays: !Ref LogRetentionDays

  DailySummaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DailySummaryFunction}'
      RetentionInDays: !Ref LogRetentionDays

  # --- Cost runaway detection (ARCHITECTURE.md §6) --------------------------------
  #
  # §6 names "Max tokens = 80; temperature = 0.2; CloudWatch billing alarm" as the
  # mitigation for Bedrock cost runaway. The two token levers are in src/lib/, as
  # src/lib/bedrockClient.ts and src/lib/daySummary.ts document. This is the detection half.
  #
  # It is declared as an AWS Budget, not a CloudWatch alarm on EstimatedCharges. That is a
  # deviation from §6's wording, recorded as decision D027, and the reason is mechanical:
  #
  #   - EstimatedCharges is not published until "monitoring and managing costs" is enabled
  #     per account from the Billing console. A template cannot flip that switch, so a
  #     CloudWatch alarm declared here would sit permanently in INSUFFICIENT_DATA for every
  #     account that had not been through the console.
  #   - The metric lives only in us-east-1 regardless of where the stack is deployed, so
  #     the alarm's region is not the stack's region.
  #   - The metric is estimated and arrives several times daily, so it can miss a small
  #     overrun entirely.
  #
  # A Budget needs none of that: it is created by CloudFormation, is account-wide, and
  # supports FORECASTED as well as ACTUAL, which is the signal that actually catches a
  # runaway before the money is spent.

  # The budget always exists, so the threshold is tracked whether or not anyone has
  # supplied an address. The notifications do not, because AWS rejects an empty
  # subscriber address: a budget with no notifications is valid, a budget with one
  # subscriber whose address is "" is not. The alternative — defaulting the parameter to a
  # placeholder address — would create a notification that can never be confirmed and
  # would fail silently at delivery time, which is the exact failure this resource exists
  # to catch.
  CostAlarmBedrockBudget:
    Type: AWS::Budgets::Budget
    Condition: HasCostAlarmEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-bedrock-monthly'
        # Scoped to Bedrock alone. An account-wide budget would fire on the NAT gateway or
        # the logs and tell the operator nothing about the one service this project's cost
        # risk is in.
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Bedrock
        BudgetLimit:
          Amount: !Ref BedrockMonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        # No TimePeriod: an end date would make AWS delete the budget and every notification
        # with it. A budget with no end date is what a permanent cost guard should be.
      NotificationsWithSubscribers:
        # FORECASTED at 80% is the notification that matters. An ACTUAL-only budget tells
        # you what you spent; a forecast tells you what you are about to, which is the
        # difference between an alert and a post-mortem.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CostAlarmEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CostAlarmEmail

  # The same budget, tracking-only, for a stack deployed without an address. Having the
  # threshold visible in the console is worth having even when nobody is subscribed to it.
  CostAlarmBedrockBudgetNoNotification:
    Type: AWS::Budgets::Budget
    Condition: HasNoCostAlarmEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-bedrock-monthly'
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Bedrock
        BudgetLimit:
          Amount: !Ref BedrockMonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY

Conditions:
  HasCostAlarmEmail: !Not [!Equals [!Ref CostAlarmEmail, '']]
  HasNoCostAlarmEmail: !Equals [!Ref CostAlarmEmail, '']

Outputs:
  DescribeDeadLetterQueueUrl:
    Description: >-
      Messages that failed five times land here. Each one is a doorbell event with no
      description; the events table row is still present, so the event is not lost.
    Value: !Ref DescribeQueueDlq
  WebhookEndpoint:
    Description: >-
      Configure this as the Ring Partner API webhook URL. The X-Signature header is
      verified against the raw body; do not enable request/response mapping that
      would re-serialise the payload before it reaches the function.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/webhook/ring'
  OverlayWebSocketUrl:
    Description: The Fire TV app connects here. Registered ids are what the pusher posts to.
    Value: !Sub 'wss://${OverlayWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod'
  OverlayDeadLetterQueueUrl:
    Description: Messages that failed five times. The event is still in the table; only the push was lost.
    Value: !Ref OverlayQueueDlq
  EventsQueryEndpoint:
    Description: >-
      GET /events/today — FR8. Requires the X-Query-Key header, whose value is the
      QueryApiKey parameter. Accepts an optional ?date=YYYY-MM-DD (UTC partition);
      defaults to today in UTC. Never deployed or validated: no AWS account, no SAM CLI.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/events/today'
  EventsTableName:
    Value: !Ref EventsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  DailySummaryTimezone:
    Description: >-
      The zone the daily summary schedule is evaluated in. If it is behind UTC, the run
      summarises the UTC date that has just begun rather than the homeowner's finished day
      — see decision D025.
    Value: !Ref DailySummaryTimezone
  BedrockBudgetName:
    Description: >-
      The AWS Budget tracking this stack's Bedrock spend (ARCHITECTURE.md §6). Notifications
      fire only if CostAlarmEmail was supplied AND that address has been confirmed in AWS.
      Never deployed or validated: no AWS account, no SAM CLI.
    Value: !If [HasCostAlarmEmail, !Ref CostAlarmBedrockBudget, !Ref CostAlarmBedrockBudgetNoNotification]
