# AWS SAM template — Front Door Intelligence
#
# NOT DEPLOYED AND NOT VALIDATED. No AWS account, no SAM CLI, and no
# `sam validate` run is available in this environment, so this file has been checked
# only for YAML well-formedness and for internal consistency with the code. Treat it
# as a scaffold, not as a working deployment.
#
# It declares exactly what exists today: the webhook ingress function and the two
# DynamoDB tables it writes to (`ARCHITECTURE.md` §3.1 and §3.5). The snapshot fetcher,
# Bedrock describer, overlay pusher, event query, and daily summary from §3.2, §3.3,
# §3.4, §3.6, and §4.2 are NOT here — they are not written. See
# docs/03-repository/04-planned-structure.md.
#
# The handler is deployed from compiled JavaScript, not TypeScript. `npm run build`
# emits CommonJS to dist/, and SAM packages the `dist` directory. The Handler
# property below is therefore `dist/handlers/webhookHandler.handler`, matching
# tsconfig.build.json's `rootDir: src`.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Front Door Intelligence — Ring webhook ingress. Event-driven serverless pipeline
  described in ARCHITECTURE.md. Only the ingress stage exists so far.

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: >-
      HMAC Signature Key from the Ring app credentials (ARCHITECTURE.md §3.1). Shown
      once when the Ring app is created and cannot be regenerated.
  RingClientId:
    Type: String
    NoEcho: true
    Description: Ring Partner API Client ID (ARCHITECTURE.md §3.1).
  RingClientSecret:
    Type: String
    NoEcho: true
    Description: Ring Partner API Client Secret (ARCHITECTURE.md §3.1).
  RingRefreshToken:
    Type: String
    NoEcho: true
    Description: >-
      Ring OAuth refresh token, ~30 day lifetime (ARCHITECTURE.md §3.2). Must be
      refreshed before expiry or the describe stage loses API access.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: >-
      ARCHITECTURE.md §3.3 offers anthropic.claude-3-haiku or amazon.nova-lite-v1 for
      cost. This is not a real ID for every account: use the one your Bedrock access
      actually lists.
  SnapshotBucketName:
    Type: String
    Default: front-door-snapshots
  EventsTableName:
    Type: String
    Default: FrontDoorEvents
  IdempotencyTableName:
    Type: String
    Default: FrontDoorIdempotency
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Globals:
  Function:
    Runtime: nodejs22.x
    # NFR1: the webhook must answer within 5 seconds. Giving the function more than
    # that would only let it die later; Ring treats a timeout as a 5xx and retries.
    Timeout: 5
    MemorySize: 256
    # Pinned to the major version actually tested. Node 24 is also verified locally.
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        # Consumed by the AWS SDK itself, not by application code.
        AWS_REGION: !Ref AWS::Region
        NODE_OPTIONS: '--enable-source-maps'

Resources:
  # --- DynamoDB (ARCHITECTURE.md §3.5) -----------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref EventsTableName
      # Partitions by date so GET /events/today is a single Query, never a scan.
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        # timestamp#event_id, so a day's events come back already time-ordered and
        # two events in the same millisecond cannot collide.
        - AttributeName: sort_key
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      # NFR7: the events table is the only durable store, so it keeps everything.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref IdempotencyTableName
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # 24 hours: long enough to absorb Ring's retry schedule (1s → 5s → 30s → 2min →
      # 10min → 1hr), short enough not to grow without bound.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # --- Ingress (ARCHITECTURE.md §3.1) ------------------------------------------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-webhook'
      CodeUri: dist/
      Handler: handlers/webhookHandler.handler
      Description: >-
        POST /webhook/ring. Verifies the X-Signature HMAC over the raw body, claims
        request_id for idempotency, stores the event, hands it to the describe queue,
        and returns immediately.
      Environment:
        Variables:
          RING_WEBHOOK_SECRET: !Ref WebhookSecret
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          DYNAMODB_IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
          EVENT_QUEUE_URL: !Ref DescribeQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - S3CrudPolicy:
            BucketName: !Ref SnapshotBucket
        # Hand-off only. Keeping the describe stage's own permissions off this function
        # is the least-privilege line ARCHITECTURE.md §6 asks for, and it is what makes
        # an ingress compromise cheap.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DescribeQueue.QueueName
      Events:
        # Ring's documented behaviour: 2xx succeeds, 4xx is a permanent failure with no
        # retry, 5xx and timeout retry. The function returns 500 on unexpected errors
        # precisely so a transient failure is retried.
        HttpApi:
          Type: Api
          Properties:
            Path: /webhook/ring
            Method: POST

  # --- Describe stage (ARCHITECTURE.md §3.2, §3.3) ------------------------------
  #
  # Separate from ingress on purpose: the Ring docs name inline heavy processing in
  # the webhook handler as a Common Mistake, because it exceeds the 5-second budget
  # NFR1 requires. This stage consumes the queue and does the media fetch and the
  # Bedrock call.

  DescribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-describe'
      CodeUri: dist/
      Handler: handlers/snapshotFetcher.handler
      Description: >-
        Fetches a camera snapshot via the Ring Partner API and produces a one-sentence
        Bedrock description. Falls back to a deterministic local summary when Bedrock
        is unavailable (FR11).
      # Longer than the webhook's 5s: this stage is deliberately off the latency path.
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          RING_CLIENT_ID: !Ref RingClientId
          RING_CLIENT_SECRET: !Ref RingClientSecret
          RING_REFRESH_TOKEN: !Ref RingRefreshToken
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DYNAMODB_EVENTS_TABLE: !Ref EventsTable
          S3_SNAPSHOT_BUCKET: !Ref SnapshotBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - S3CrudPolicy:
            BucketName: !Ref SnapshotBucket
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        DescribeQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt DescribeQueue.QueueArn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  DescribeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-describe'
      # The event is a signal, not a record. The events table is the record, so a lost
      # message costs a description, not an event.
      MessageRetentionPeriod: 345600
      # Must exceed the function's 60s timeout, or a slow invocation is redelivered
      # while the first is still running.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DescribeQueueDlq.Arn
        maxReceiveCount: 5

  DescribeQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-describe-dlq'
      MessageRetentionPeriod: 1209600

  # --- Snapshot storage (ARCHITECTURE.md §3.5, §6) -------------------------------

  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SnapshotBucketName
      # Not public, per §6. Access is via pre-signed URLs with a 1-hour expiry.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub '${SnapshotBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # --- API Gateway (ARCHITECTURE.md §3.1) ---------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AWS::StackName

  # --- Observability (ARCHITECTURE.md §7) ---------------------------------------

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WebhookFunction}'
      RetentionInDays: !Ref LogRetentionDays

  DescribeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DescribeFunction}'
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  DescribeDeadLetterQueueUrl:
    Description: >-
      Messages that failed five times land here. Each one is a doorbell event with no
      description; the events table row is still present, so the event is not lost.
    Value: !Ref DescribeQueueDlq
  WebhookEndpoint:
    Description: >-
      Configure this as the Ring Partner API webhook URL. The X-Signature header is
      verified against the raw body; do not enable request/response mapping that
      would re-serialise the payload before it reaches the function.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/webhook/ring'
  EventsTableName:
    Value: !Ref EventsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
